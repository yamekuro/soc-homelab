&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Por qué estos&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Why these&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;El phishing es la vía de acceso inicial más observada (60 % de los casos) y la explotación de vulnerabilidades la segunda (21,3 %); el ransomware domina la ciberdelincuencia contra organizaciones de la UE (&lt;a href=&quot;https://www.enisa.europa.eu/sites/default/files/2026-01/ENISA%20Threat%20Landscape%202025_v1.2.pdf&quot; rel=&quot;noreferrer&quot; target=&quot;_blank&quot;&gt;ENISA Threat Landscape 2025&lt;/a&gt;).&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Phishing is the most observed initial access vector (60% of cases) and vulnerability exploitation the second (21.3%); ransomware dominates cybercrime against EU organisations (&lt;a href=&quot;https://www.enisa.europa.eu/sites/default/files/2026-01/ENISA%20Threat%20Landscape%202025_v1.2.pdf&quot; rel=&quot;noreferrer&quot; target=&quot;_blank&quot;&gt;ENISA Threat Landscape 2025&lt;/a&gt;).&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Criterios&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Criteria&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Habitual en informes de amenazas · presente en las tareas de ofertas junior · reproducible de forma segura en el laboratorio · con telemetría disponible en su fase.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Common in threat reports · part of junior job tasks · safely reproducible in the lab · telemetry available in its phase.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Cómo se usa&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;How it is used&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Ordena las detecciones (D1), sirve de guion a las pruebas adversarias (F1) y es la referencia para medir la cobertura en P6. Cada escenario tiene un control benigno comparable.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Orders the detections (D1), scripts the adversarial tests (F1) and is the baseline for measuring coverage in P6. Every scenario has a comparable benign control.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Aislamiento&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Isolation&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;El Windows de trabajo queda fuera del escenario adversario. Las redes internas virtuales iniciales no se presentan como VLAN 802.1Q.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;The Windows workstation stays outside the adversarial scenario. The initial internal virtual networks are not presented as 802.1Q VLANs.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;Cloud&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Azure / Entra y la cuenta AWS del laboratorio forman dos límites de confianza externos. La ingesta se configura por conector y origen; no se presupone una VPN ni acceso entrante.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Azure / Entra and the lab AWS account form two external trust boundaries. Ingestion is configured per connector and source; no VPN or inbound access is assumed.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;bp-list-item&quot;&gt;&lt;span class=&quot;bp-code&quot;&gt;D1&lt;/span&gt;&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Contrato de datos&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Data contract&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Hora de origen e ingesta · host · usuario · proceso · origen · ID de evento · versión de regla · resultado esperado.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Source and ingestion time · host · user · process · source · event ID · rule version · expected outcome.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;bp-list-item&quot;&gt;&lt;span class=&quot;bp-code&quot;&gt;D2&lt;/span&gt;&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Consulta correcta&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;The right query&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Wazuh Indexer: búsquedas de alertas indexadas. Wazuh Server API: agentes, estado y configuración. Sentinel / Splunk: adaptadores con consultas y permisos propios.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Wazuh Indexer: searches over indexed alerts. Wazuh Server API: agents, status and configuration. Sentinel / Splunk: adapters with their own queries and permissions.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;bp-list-item&quot;&gt;&lt;span class=&quot;bp-code&quot;&gt;D3&lt;/span&gt;&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Fuentes comparables&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Comparable sources&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Conservar fixtures y eventos normalizados. La réplica hacia Sentinel o Splunk usa una selección documentada; no se supone que las detecciones Wazuh se conviertan automáticamente. Las reglas Sigma del LLMjacking son el primer caso real de portabilidad.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Keep fixtures and normalised events. Replication to Sentinel or Splunk uses a documented selection; Wazuh detections are not assumed to convert automatically. The LLMjacking Sigma rules are the first real portability case.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;bp-list-item&quot;&gt;&lt;span class=&quot;bp-code&quot;&gt;D4&lt;/span&gt;&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Cierre verificable&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Verifiable closure&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Un playbook exitoso no prueba contención. Confirmar el estado del endpoint, el bloqueo o la revocación y comprobar la recuperación del servicio.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;A successful playbook does not prove containment. Confirm the endpoint state, the block or revocation, and check that the service has recovered.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Nivel 1 · Asistir&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Level 1 · Assist&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Resumir eventos y construir una cronología con referencias. Acceso de lectura; sin acciones de contención.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Summarise events and build a referenced timeline. Read-only access; no containment actions.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Nivel 2 · Investigar&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Level 2 · Investigate&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Elegir consultas permitidas, contrastar hipótesis y solicitar artefactos a través de un flujo aprobado.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Choose permitted queries, test hypotheses and request artefacts through an approved workflow.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Nivel 3 · Actuar&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Level 3 · Act&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Playbooks acotados. Las acciones preautorizadas se limitan a escenarios reversibles del laboratorio y se verifican.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Scoped playbooks. Pre-authorised actions are limited to reversible lab scenarios and are verified.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;IA como superficie de ataque&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;AI as an attack surface&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;bp-strip&quot;&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Credenciales robadas&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Stolen credentials&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Claves de acceso usadas para invocar modelos de pago a costa de la víctima. Detección con CloudTrail y el registro de invocaciones de Bedrock.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Access keys used to invoke paid models at the victim’s expense. Detected with CloudTrail and Bedrock model invocation logging.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Coste como señal&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Cost as a signal&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Anomalías de gasto y volumen de invocaciones como indicador temprano, siempre contrastadas con la telemetría.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Spend anomalies and invocation volume as an early indicator, always checked against the telemetry.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;El propio asistente&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;The assistant itself&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Las credenciales del modelo que usa el asistente se vigilan con las mismas detecciones de LLMjacking.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;The credentials for the model the assistant uses are monitored with the same LLMjacking detections.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;text-small&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span data-l=&quot;es&quot;&gt;Umbrales, modelo, proveedor y framework: decisión pendiente tras definir los casos. Un sistema multiagente se adoptará solo si mejora la evaluación frente a un agente único.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Thresholds, model, provider and framework: decision pending once the cases are defined. A multi-agent system will only be adopted if it improves evaluation results over a single agent.&lt;/span&gt;&lt;/div&gt;

&lt;div class=&quot;bp-sheet-head&quot;&gt;&lt;h2&gt;&lt;span data-l=&quot;es&quot;&gt;Construir → probar → publicar&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Build → test → publish&lt;/span&gt;&lt;/h2&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;span data-l=&quot;es&quot;&gt;Secuencia por dependencias · esfuerzo estimado, sin fechas ficticias&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Dependency-driven sequence · estimated effort, no made-up dates&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;bp-milestone&quot;&gt;&lt;span data-l=&quot;es&quot;&gt;&lt;strong&gt;Hito · portfolio mínimo:&lt;/strong&gt; track L completado + P2 (primer caso SOC completo). Es la única prioridad hasta cumplirlo; el resto amplía. Orientativo: 3–5 meses a dedicación parcial. Al cumplirlo se prepara una vista resumida de una página para reclutadores: qué es, qué está hecho, qué demuestra y enlaces.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;strong&gt;Milestone · minimum portfolio:&lt;/strong&gt; track L complete + P2 (first end-to-end SOC case). It is the only priority until met; the rest extends it. Indicative: 3–5 months part-time. Once met, a one-page recruiter summary is prepared: what it is, what is done, what it demonstrates, and links.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;text-small bp-effort-key&quot;&gt;&lt;span data-l=&quot;es&quot;&gt;Esfuerzo por fase: S ≈ 1–2 semanas · M ≈ 3–5 · L ≈ 6–10 · XL más de 10, a dedicación parcial (~10–15 h / semana). Estimación inicial: se recalibra con el tiempo real de P0.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Effort per phase: S ≈ 1–2 weeks · M ≈ 3–5 · L ≈ 6–10 · XL 10+, part-time (~10–15 h / week). Initial estimate: recalibrated with the actual time taken by P0.&lt;/span&gt;&lt;/div&gt;
&lt;div id=&quot;bp-phases&quot;&gt;&lt;/div&gt;
&lt;h3 style=&quot;margin-top:24px&quot;&gt;&lt;span data-l=&quot;es&quot;&gt;Publicación de cada fase&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Publishing each phase&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;bp-strip&quot;&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Formato&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Format&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Decisión · por qué · trade-off · problemas encontrados · verificación · pendientes · línea para el CV.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Decision · why · trade-off · problems found · verification · open items · résumé line.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Dónde&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Where&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Carpeta writeups/ del repositorio soc-homelab, publicada en GitHub Pages. El track L publica en la misma carpeta.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;The writeups/ folder of the soc-homelab repository, published on GitHub Pages. Track L publishes in the same folder.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;es&quot;&gt;Cuándo&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;When&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;es&quot;&gt;Una fase se cierra al superar su criterio de salida y publicar su write-up. Nada se publica sin verificar ni con datos sensibles.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;A phase closes when it passes its exit gate and its write-up is published. Nothing is published unverified or with sensitive data.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;text-small&quot;&gt;&lt;span data-l=&quot;es&quot;&gt;Cada decisión se documenta en docs/decisions/ con las opciones valoradas, el criterio aplicado y el resultado.&lt;/span&gt;&lt;span data-l=&quot;en&quot;&gt;Each decision is documented in docs/decisions/ with the options considered, the criterion applied and the outcome.&lt;/span&gt;&lt;/div&gt;
