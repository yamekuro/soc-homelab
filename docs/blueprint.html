&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Why these&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Phishing is the most observed initial access vector (60% of cases) and vulnerability exploitation the second (21.3%); ransomware dominates cybercrime against EU organisations (&lt;a href=&quot;https://www.enisa.europa.eu/sites/default/files/2026-01/ENISA%20Threat%20Landscape%202025_v1.2.pdf&quot; rel=&quot;noreferrer&quot; target=&quot;_blank&quot;&gt;ENISA Threat Landscape 2025&lt;/a&gt;).&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Criteria&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Common in threat reports · part of junior job tasks · safely reproducible in the lab · telemetry available in its phase.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;How it is used&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Orders the detections (D1), scripts the adversarial tests (F1) and is the baseline for measuring coverage in P6. Every scenario has a comparable benign control.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;strong&gt;T1&lt;/strong&gt; · Brute force and password spraying&lt;/span&gt;&lt;/td&gt;&lt;td&gt;T1110.001 · T1110.003&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;SSH / Linux authentication · events 4625 / 4624 · Entra sign-ins (P3)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;User mistyping their password&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P2 · B3 · C2 → P3 · B2 · C3&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;strong&gt;T3&lt;/strong&gt; · Credential theft and lateral movement in AD&lt;/span&gt;&lt;/td&gt;&lt;td&gt;T1003.001 · T1550.002 · T1021.002&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Sysmon · Windows security · domain controller&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Legitimate SMB / RDP administration from MGMT&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P3 · B1 · B2 · D1&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;strong&gt;T4&lt;/strong&gt; · Web application exploitation in the DMZ&lt;/span&gt;&lt;/td&gt;&lt;td&gt;T1190 · T1505.003&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;nginx / application · Suricata / Zeek · Linux auditing&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Scheduled legitimate web traffic&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P4 · B3 · C1&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;strong&gt;T7&lt;/strong&gt; · LLMjacking in AWS&lt;/span&gt;&lt;/td&gt;&lt;td&gt;T1078.004 · T1496.004&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;CloudTrail · Bedrock invocations · cost&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Legitimate invocation from the expected identity&lt;/span&gt;&lt;/td&gt;&lt;td&gt;L · C4&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;strong&gt;T8&lt;/strong&gt; · Prompt injection in logs against the AI assistant&lt;/span&gt;&lt;/td&gt;&lt;td&gt;ATLAS AML.T0051.001&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Assistant traces · queries and proposed actions&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Log field with similar legitimate text&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P5 · E3&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;text-small&quot;&gt;&lt;span data-l=&quot;en&quot;&gt;The P6 campaign chains T2 → T3 → T5 → T7. The catalogue is reviewed at every blueprint revision; T1486 is simulated on synthetic data.&lt;/span&gt;&lt;/div&gt;

&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Target access matrix&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;span data-l=&quot;en&quot;&gt;Source → destination&lt;/span&gt;&lt;/th&gt;&lt;th&gt;&lt;span data-l=&quot;en&quot;&gt;Intended access&lt;/span&gt;&lt;/th&gt;&lt;th&gt;&lt;span data-l=&quot;en&quot;&gt;Verifiable condition&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Administrator → MGMT&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Bastion / console&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Individual identity; audited access; MFA where supported&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;USERS → SERVERS&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;AD, DNS, file shares and applications&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Per-service ports; AD detailed before deployment&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;DMZ → internal&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Justified dependencies and logs only&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Negative test of access to USERS / MGMT&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;

&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;AI → tool gateway&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Queries and hypotheses&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Restricted API; no direct administrative credentials&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Orchestrator → controls&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Specific actions&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Approval, service identity, rollback and auditing&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;AWS (lab) → SOC&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Connector-based ingestion&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;No inbound access; read-only identity; ingestion cost logged&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Scanner (SOC) → USERS / SERVERS / DMZ&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Scheduled authenticated scanning&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Defined window; read-only credentials; expected activity logged in the SIEM&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Detonation sandbox → Internet&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;None by default&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;No egress; any temporary exception is justified and logged in the case&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Lab → cloud / Internet&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Required egress&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Allow-listed destinations; logged egress; no exposed victims&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;bp-strip&quot;&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Observation&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Suricata / Zeek receive traffic via a mirror or a tested capture point. Traffic within a single zone requires additional visibility.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Isolation&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;The Windows workstation stays outside the adversarial scenario. The initial internal virtual networks are not presented as 802.1Q VLANs.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;Cloud&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Azure / Entra and the lab AWS account form two external trust boundaries. Ingestion is configured per connector and source; no VPN or inbound access is assumed.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section aria-labelledby=&quot;bp-tab-flow&quot; class=&quot;bp-sheet&quot; hidden=&quot;&quot; id=&quot;bp-flow&quot; role=&quot;tabpanel&quot;&gt;
&lt;div class=&quot;bp-sheet-head&quot;&gt;&lt;h2&gt;&lt;span data-l=&quot;en&quot;&gt;From event to recovery&lt;/span&gt;&lt;/h2&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;span data-l=&quot;en&quot;&gt;Every arrow has evidence behind it&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
&lt;svg aria-label=&quot;Path from endpoint and cloud events through detection, case, response and verification&quot; class=&quot;bp-diagram&quot; id=&quot;bp-flow-svg&quot; role=&quot;img&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;bp-legend text-small&quot;&gt;&lt;span class=&quot;bp-key&quot;&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;i&gt;&lt;/i&gt;Telemetry / evidence&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;bp-key&quot;&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;i class=&quot;response&quot;&gt;&lt;/i&gt;Controlled action&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;bp-key&quot;&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;i class=&quot;ai&quot;&gt;&lt;/i&gt;AI assistance&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;bp-list&quot;&gt;
&lt;div class=&quot;bp-list-item&quot;&gt;&lt;span class=&quot;bp-code&quot;&gt;D1&lt;/span&gt;&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Data contract&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Source and ingestion time · host · user · process · source · event ID · rule version · expected outcome.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;bp-list-item&quot;&gt;&lt;span class=&quot;bp-code&quot;&gt;D2&lt;/span&gt;&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;The right query&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Wazuh Indexer: searches over indexed alerts. Wazuh Server API: agents, status and configuration. Sentinel / Splunk: adapters with their own queries and permissions.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;bp-list-item&quot;&gt;&lt;span class=&quot;bp-code&quot;&gt;D3&lt;/span&gt;&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Comparable sources&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Keep fixtures and normalised events. Replication to Sentinel or Splunk uses a documented selection; Wazuh detections are not assumed to convert automatically. The LLMjacking Sigma rules are the first real portability case.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;bp-list-item&quot;&gt;&lt;span class=&quot;bp-code&quot;&gt;D4&lt;/span&gt;&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Verifiable closure&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;A successful playbook does not prove containment. Confirm the endpoint state, the block or revocation, and check that the service has recovered.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/section&gt;
&lt;section aria-labelledby=&quot;bp-tab-ai&quot; class=&quot;bp-sheet&quot; hidden=&quot;&quot; id=&quot;bp-ai&quot; role=&quot;tabpanel&quot;&gt;
&lt;div class=&quot;bp-sheet-head&quot;&gt;&lt;h2&gt;&lt;span data-l=&quot;en&quot;&gt;AI that investigates with evidence&lt;/span&gt;&lt;/h2&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;span data-l=&quot;en&quot;&gt;Swappable model · explicit permissions&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
&lt;svg aria-label=&quot;Proposed assistant architecture: case, gateway, queries, evidence, inference, validation and human review&quot; class=&quot;bp-diagram&quot; id=&quot;bp-ai-svg&quot; role=&quot;img&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;bp-strip&quot;&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Level 1 · Assist&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Summarise events and build a referenced timeline. Read-only access; no containment actions.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Level 2 · Investigate&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Choose permitted queries, test hypotheses and request artefacts through an approved workflow.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Level 3 · Act&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Scoped playbooks. Pre-authorised actions are limited to reversible lab scenarios and are verified.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;AI as an attack surface&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;bp-strip&quot;&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Stolen credentials&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Access keys used to invoke paid models at the victim’s expense. Detected with CloudTrail and Bedrock model invocation logging.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Cost as a signal&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Spend anomalies and invocation volume as an early indicator, always checked against the telemetry.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;The assistant itself&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;The credentials for the model the assistant uses are monitored with the same LLMjacking detections.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Evaluation bench&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;span data-l=&quot;en&quot;&gt;Test&lt;/span&gt;&lt;/th&gt;&lt;th&gt;&lt;span data-l=&quot;en&quot;&gt;Measure&lt;/span&gt;&lt;/th&gt;&lt;th&gt;&lt;span data-l=&quot;en&quot;&gt;Artefact&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Legitimate / suspicious activity&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Precision, recall and confusion matrix on labelled cases&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Dataset kept separate from development examples&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Conclusions and citations&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Unsupported claims; valid references&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Report compared against manual review&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Insufficient evidence&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Appropriate abstentions; useful questions&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Cases with missing or contradictory events&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Prompt injection in logs&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Unauthorised actions or instructions accepted&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Adversarial tests on controllable fields&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Tool unavailable&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Bounded retries, explicit failure, traceability&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Execution and exception log&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;LLMjacking case&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Timeline, scope and compromised credential correctly identified&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Cases generated in track L (AWS)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Operational value&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Triage time, cost per case and human corrections&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Manual vs assisted comparison with the same scope&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;
&lt;/table&gt;&lt;/div&gt;
&lt;div class=&quot;text-small&quot; style=&quot;margin-top:14px&quot;&gt;&lt;span data-l=&quot;en&quot;&gt;Thresholds, model, provider and framework: decision pending once the cases are defined. A multi-agent system will only be adopted if it improves evaluation results over a single agent.&lt;/span&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section aria-labelledby=&quot;bp-tab-build&quot; class=&quot;bp-sheet&quot; hidden=&quot;&quot; id=&quot;bp-build&quot; role=&quot;tabpanel&quot;&gt;
&lt;div class=&quot;bp-sheet-head&quot;&gt;&lt;h2&gt;&lt;span data-l=&quot;en&quot;&gt;Build → test → publish&lt;/span&gt;&lt;/h2&gt;&lt;span class=&quot;text-small&quot;&gt;&lt;span data-l=&quot;en&quot;&gt;Dependency-driven sequence · estimated effort, no made-up dates&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;bp-milestone&quot;&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;strong&gt;Milestone · minimum portfolio:&lt;/strong&gt; track L complete + P2 (first end-to-end SOC case). It is the only priority until met; the rest extends it. Indicative: 3–5 months part-time. Once met, a one-page recruiter summary is prepared: what it is, what is done, what it demonstrates, and links.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;text-small bp-effort-key&quot;&gt;&lt;span data-l=&quot;en&quot;&gt;Effort per phase: S ≈ 1–2 weeks · M ≈ 3–5 · L ≈ 6–10 · XL 10+, part-time (~10–15 h / week). Initial estimate: recalibrated with the actual time taken by P0.&lt;/span&gt;&lt;/div&gt;
&lt;div id=&quot;bp-phases&quot;&gt;&lt;/div&gt;
&lt;h3 style=&quot;margin-top:24px&quot;&gt;&lt;span data-l=&quot;en&quot;&gt;Publishing each phase&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;bp-strip&quot;&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Format&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;Decision · why · trade-off · problems found · verification · open items · résumé line.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Where&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;The writeups/ folder of the soc-homelab repository, published on GitHub Pages. Track L publishes in the same folder.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div&gt;&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;When&lt;/span&gt;&lt;/h3&gt;&lt;div&gt;&lt;span data-l=&quot;en&quot;&gt;A phase closes when it passes its exit gate and its write-up is published. Nothing is published unverified or with sensitive data.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;h3&gt;&lt;span data-l=&quot;en&quot;&gt;Decision register&lt;/span&gt;&lt;/h3&gt;
&lt;div class=&quot;text-small&quot;&gt;&lt;span data-l=&quot;en&quot;&gt;Each decision is documented in docs/decisions/ with the options considered, the criterion applied and the outcome.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;
&lt;thead&gt;&lt;tr&gt;&lt;th&gt;&lt;span data-l=&quot;en&quot;&gt;Decision&lt;/span&gt;&lt;/th&gt;&lt;th&gt;&lt;span data-l=&quot;en&quot;&gt;Criteria&lt;/span&gt;&lt;/th&gt;&lt;th&gt;&lt;span data-l=&quot;en&quot;&gt;Before&lt;/span&gt;&lt;/th&gt;&lt;th&gt;&lt;span data-l=&quot;en&quot;&gt;Outcome&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Hypervisor and host (CPU / RAM / storage)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Capacity for each phase’s concurrent VMs (Wazuh all-in-one needs 4 vCPU and 8 GiB), snapshots, internal networks and cost&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;b&gt;Decided&lt;/b&gt; · VMware Workstation Pro on Windows 11 (16-core Ryzen, 32 GB, 2 TB SSD)&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Firewall / router&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Per-zone rules, NAT, path to VLANs, configuration export and similarity to Fortinet / Palo Alto&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;b&gt;Decided&lt;/b&gt; · OPNsense&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Addressing&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;No collisions with the home network; one range per zone; range reserved for OT&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;&lt;b&gt;Decided&lt;/b&gt; · 10.77.0.0/16, one /24 per zone; isolated, unrouted sandbox&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Certifications and order&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Fit with the phase and with target job ads (Security+, BTL1, SC-200, AZ-500)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Pending&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Data retention&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Available storage, data type and investigation needs&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Pending&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Case manager&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Templates, API for orchestration and case export&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Pending&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Vulnerability scanner&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Authenticated scanning, API and free-tier limits&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Pending&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Phishing sandbox&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;No-egress isolation, no samples sent to third parties unless non-sensitive, IOC extraction&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Pending&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Commercial EDR&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Trial availability and length, containment API, presence in job ads (Defender, CrowdStrike)&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P3&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Pending&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Azure / M365 tenant and licences&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Monthly cost, ingestion limits and teardown when the block closes&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P3&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Pending&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Orchestrator&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Integration with case manager and SIEM, approvals and idempotency&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P4&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Pending&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;CTI provider&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Quotas, terms of use and provenance&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P4&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Pending&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;Security Onion&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Only if it adds value over Wazuh + Suricata + Zeek; not a mandatory second stack&lt;/span&gt;&lt;/td&gt;&lt;td&gt;P4&lt;/td&gt;&lt;td&gt;&lt;span data-l=&quot;en&quot;&gt;Pending&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
