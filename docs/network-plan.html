<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Plano de red soc-homelab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root{
  --paper:#EEF1F0; --panel:#E4E9E8; --card:#F8FAF9; --ink:#13202B; --ink-2:#51606C; --ink-3:#7C8A94;
  --rule:#C3CDD1; --grid:#DCE3E3; --grid-2:#CFD8D9;
  --z-mgmt:#3E5A78; --z-users:#2463B0; --z-servers:#0E7C74; --z-dmz:#C24E1A; --z-soc:#5A46C2; --z-attack:#A3286A;
  --z-wan:#66737F; --z-ai:#8E44AD; --z-ot:#7A6A2E; --z-host:#13202B;
  --admin:#C27A0A; --allow:#1D7A4C; --deny:#B42318; --cond:#A86A00;
  --allow-bg:#DCEFE4; --deny-bg:#F6E1DE; --cond-bg:#F5E9CF; --same-bg:#E4E9E8;
  --disp:"Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0D1316; --panel:#141C20; --card:#18222700; --ink:#E4EAEC; --ink-2:#A1AFB7; --ink-3:#6F7E87;
    --rule:#2B383E; --grid:#162024; --grid-2:#1C282D;
    --z-mgmt:#93AECB; --z-users:#6FA8EA; --z-servers:#45C0B4; --z-dmz:#F08A55; --z-soc:#A596F2; --z-attack:#E871AE;
    --z-wan:#98A5AF; --z-ai:#C98DE2; --z-ot:#CBB870; --z-host:#E4EAEC;
    --admin:#EBB04A; --allow:#55C68F; --deny:#F2766A; --cond:#E6B04A;
    --allow-bg:#123124; --deny-bg:#3A1714; --cond-bg:#34280F; --same-bg:#172024;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0D1316; --panel:#141C20; --card:#182227; --ink:#E4EAEC; --ink-2:#A1AFB7; --ink-3:#6F7E87;
  --rule:#2B383E; --grid:#162024; --grid-2:#1C282D;
  --z-mgmt:#93AECB; --z-users:#6FA8EA; --z-servers:#45C0B4; --z-dmz:#F08A55; --z-soc:#A596F2; --z-attack:#E871AE;
  --z-wan:#98A5AF; --z-ai:#C98DE2; --z-ot:#CBB870; --z-host:#E4EAEC;
  --admin:#EBB04A; --allow:#55C68F; --deny:#F2766A; --cond:#E6B04A;
  --allow-bg:#123124; --deny-bg:#3A1714; --cond-bg:#34280F; --same-bg:#172024;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --card:#182227; } }

*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; margin:0}
.sheet{max-width:1240px; margin:0 auto; padding-inline:20px; padding-block:24px 56px; display:grid; gap:40px}
a{color:inherit}
.mono{font-family:var(--mono)}
h1,h2,h3{font-family:var(--disp); font-stretch:75%; margin:0; text-wrap:balance; letter-spacing:.005em}
h2{font-size:30px; font-weight:750; line-height:1.05}
h3{font-size:19px; font-weight:700}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2)}
.lede{color:var(--ink-2); max-width:68ch; margin:6px 0 0}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--admin); outline-offset:2px}

/* ---------- title block ---------- */
.titleblock{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:end; border-bottom:2px solid var(--ink); padding-bottom:18px}
.titleblock h1{font-size:clamp(40px,7vw,78px); font-weight:800; line-height:.92; letter-spacing:0; word-spacing:.14em}
.titleblock h1 span{display:block; font-family:var(--body); font-size:clamp(16px,2.1vw,21px); font-weight:500; font-stretch:100%; letter-spacing:0; word-spacing:normal; color:var(--ink-2); margin-top:14px; line-height:1.35; max-width:52ch; text-wrap:balance}
.tb-right{display:grid; gap:10px; justify-items:end}
.tb-table{display:grid; grid-template-columns:repeat(3,auto); border:1.5px solid var(--ink); font-family:var(--mono); font-size:11px}
.tb-table div{padding:5px 10px; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); min-width:92px}
.tb-table div:nth-child(3n){border-right:none}
.tb-table div:nth-last-child(-n+3){border-bottom:none}
.tb-table b{display:block; font-size:9.5px; letter-spacing:.12em; color:var(--ink-3); font-weight:600}
.lang{display:inline-flex; border:1.5px solid var(--ink); border-radius:3px; overflow:hidden}
.lang button{background:none; border:none; padding:4px 12px; font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.08em; cursor:pointer; color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
@media (max-width:760px){ .titleblock{grid-template-columns:1fr} .tb-right{justify-items:start} }
@media (max-width:460px){ .tb-table{grid-template-columns:repeat(2,auto)} .tb-table div:nth-child(3n){border-right:1px solid var(--rule)} .tb-table div:nth-child(2n){border-right:none} .tb-table div:nth-last-child(-n+3){border-bottom:1px solid var(--rule)} .tb-table div:nth-last-child(-n+2){border-bottom:none} }

/* ---------- diagram ---------- */
.drawing{border:1.5px solid var(--ink); background:
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/24px 24px, var(--paper); position:relative}
.drawing-scroll{overflow-x:auto}
.drawing svg{display:block; width:100%; min-width:960px; height:auto}
.drawing-cap{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:8px 12px; border-top:1.5px solid var(--ink); font-family:var(--mono); font-size:11px; color:var(--ink-2); background:var(--paper)}
.scroll-hint{display:none}
@media (max-width:980px){ .scroll-hint{display:inline} }

svg text{fill:var(--ink); font-family:var(--body)}
.t-disp{font-family:var(--disp); font-stretch:75%; font-weight:750}
.t-mono{font-family:var(--mono)}
.t-2{fill:var(--ink-2)}
.t-3{fill:var(--ink-3)}
.box-host{fill:none; stroke:var(--ink); stroke-width:2}
.box-vm{fill:none; stroke:var(--ink-2); stroke-width:1.2; stroke-dasharray:6 4}
.box-home{fill:var(--paper); stroke:var(--ink-2); stroke-width:1.2}
.chip{fill:var(--card); stroke:var(--rule); stroke-width:1}
.fw{fill:var(--ink)}
.fw-t{fill:var(--paper)}
.fw-t2{fill:var(--paper); opacity:.72}
.panel{fill:var(--card); stroke:var(--rule); stroke-width:1}
.vmcard{fill:var(--paper); stroke:var(--rule); stroke-width:1}
.ghost{fill:none; stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:5 5}
.sbx{fill:var(--card); stroke:var(--ink); stroke-width:1.6; stroke-dasharray:2 4}
.link{fill:none; stroke-width:2.2}
.link-ink{fill:none; stroke:var(--ink); stroke-width:2}
.admin-path{fill:none; stroke:var(--admin); stroke-width:2.4; stroke-dasharray:7 6; animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
@media (prefers-reduced-motion: reduce){ .admin-path{animation:none} }
.block-dot{fill:var(--deny)}
.dim{opacity:.18; transition:opacity .2s}
.hl{opacity:1}

/* ---------- sections ---------- */
.sec-head{display:grid; gap:4px; margin-bottom:16px}
.two{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:32px}
@media (max-width:900px){ .two{grid-template-columns:1fr} }

/* ram */
.ram-bar{display:flex; height:46px; border:1.5px solid var(--ink); overflow:hidden}
.ram-seg{position:relative; display:flex; align-items:flex-end; padding:0 5px 4px; font-family:var(--mono); font-size:10.5px; font-weight:700; color:#fff; min-width:0; overflow:hidden; white-space:nowrap}
.ram-seg.host{background:repeating-linear-gradient(135deg, var(--ink-3) 0 6px, var(--ink-2) 6px 12px)}
.ram-seg.ondemand{background:repeating-linear-gradient(135deg, var(--z-attack) 0 5px, transparent 5px 10px); color:var(--ink)}
.ram-seg + .ram-seg{border-left:1.5px solid var(--paper)}
.ram-scale{display:flex; justify-content:space-between; font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-top:4px; font-variant-numeric:tabular-nums}
.ram-legend{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:6px 16px; margin-top:14px; font-size:13px}
.ram-legend span{display:flex; gap:8px; align-items:center}
.sw{width:12px; height:12px; flex:none; border:1px solid var(--rule)}
.verdict{margin-top:16px; padding:12px 14px; border-left:4px solid var(--cond); background:var(--cond-bg); font-size:14px}
.verdict b{font-family:var(--mono)}
.save-list{margin:10px 0 0; padding-left:18px; font-size:14px; color:var(--ink-2)}

/* tables */
.tbl-wrap{overflow-x:auto; border-top:2px solid var(--ink)}
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); text-align:left; font-weight:600; padding:9px 10px; border-bottom:1px solid var(--ink)}
td{padding:9px 10px; border-bottom:1px solid var(--rule); vertical-align:top}
td.mono, .mono{font-variant-numeric:tabular-nums}
.zdot{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:8px; vertical-align:-1px}
.act{display:inline-block; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.06em; padding:2px 7px; border-radius:2px; white-space:nowrap}
.act.allow{background:var(--allow-bg); color:var(--allow)}
.act.deny{background:var(--deny-bg); color:var(--deny)}
.act.cond{background:var(--cond-bg); color:var(--cond)}
.rid{font-family:var(--mono); font-weight:700}
tr.is-hl td{background:var(--cond-bg)}

/* matrix */
.matrix-wrap{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:24px; align-items:start}
@media (max-width:980px){ .matrix-wrap{grid-template-columns:1fr} }
.mx-scroll{overflow-x:auto}
.mx{display:grid; grid-template-columns:120px repeat(8, minmax(74px,1fr)); gap:3px; min-width:760px}
.mx .h{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; font-weight:700; padding:6px 4px; color:var(--ink-2); display:flex; align-items:flex-end; gap:6px}
.mx .h.col{justify-content:center; text-align:center; border-bottom:3px solid var(--c, var(--ink-3))}
.mx .h.row{border-left:3px solid var(--c, var(--ink-3)); padding-left:8px; align-items:center}
.mx .corner{font-family:var(--mono); font-size:10px; color:var(--ink-3); align-self:end; padding:6px 4px}
.cell{border:none; min-height:54px; padding:6px 5px; cursor:pointer; display:grid; place-items:center; text-align:center; font-family:var(--mono); font-size:10.5px; font-weight:600; line-height:1.25; border-radius:2px; transition:transform .12s}
.cell:hover{transform:translateY(-1px)}
.cell.allow{background:var(--allow-bg); color:var(--allow)}
.cell.deny{background:var(--deny-bg); color:var(--deny)}
.cell.cond{background:var(--cond-bg); color:var(--cond); outline:1.5px dashed var(--cond); outline-offset:-4px}
.cell.same{background:var(--same-bg); color:var(--ink-3); cursor:default}
.cell.na{background:transparent; color:var(--ink-3); cursor:default; border:1px dashed var(--rule)}
.cell[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink); position:relative; z-index:1}
.cell .sym{font-size:15px; display:block}
.detail{border:1.5px solid var(--ink); padding:16px; background:var(--card); display:grid; gap:10px; position:sticky; top:calc(env(safe-area-inset-top,0px) + 12px)}
.detail .route{font-family:var(--disp); font-stretch:75%; font-weight:750; font-size:26px; line-height:1}
.detail p{margin:0; font-size:14px}
.detail ul{margin:0; padding-left:0; list-style:none; display:grid; gap:8px}
.detail li{font-size:13.5px; display:grid; grid-template-columns:auto 1fr; gap:8px}
.mx-legend{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; font-size:12.5px; color:var(--ink-2)}
.mx-legend span{display:inline-flex; gap:7px; align-items:center}
.mx-legend i{display:inline-block; width:16px; height:12px; border-radius:2px}

/* notes */
.notes{counter-reset:n; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px 28px; margin:0; padding:0; list-style:none}
.notes li{counter-increment:n; display:grid; grid-template-columns:34px 1fr; gap:10px; font-size:14px; padding-top:10px; border-top:1px solid var(--rule)}
.notes li::before{content:counter(n, decimal-leading-zero); font-family:var(--mono); font-weight:700; color:var(--admin)}
.notes code{font-family:var(--mono); font-size:12.5px; background:var(--panel); padding:1px 4px; border-radius:2px}
footer{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; border-top:2px solid var(--ink); padding-top:10px; font-family:var(--mono); font-size:11px; color:var(--ink-2)}
</style>

<div class="sheet" id="app">
  <header class="titleblock">
    <div>
      <div class="eyebrow" id="t-eyebrow"></div>
      <h1 id="t-title"></h1>
    </div>
    <div class="tb-right">
      <div class="lang" role="group" aria-label="Idioma · Language">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="tb-table" id="t-block"></div>
    </div>
  </header>

  <section aria-labelledby="h-diagram">
    <div class="sec-head">
      <div class="eyebrow" id="t-d-eyebrow"></div>
      <h2 id="h-diagram"></h2>
      <p class="lede" id="t-d-lede"></p>

      <figcaption class="drawing-cap"><span id="t-d-cap"></span><span class="scroll-hint" id="t-d-hint"></span></figcaption>
    </figure>
  </section>

  <section aria-labelledby="h-matrix">
    <div class="sec-head">
      <div class="eyebrow" id="t-m-eyebrow"></div>
      <h2 id="h-matrix"></h2>
      <p class="lede" id="t-m-lede"></p>
    </div>
    <div class="matrix-wrap">
      <div>
        <div class="mx-scroll"><div class="mx" id="mx"></div></div>
        <div class="mx-legend" id="mx-legend"></div>
      </div>
      <aside class="detail" id="detail" aria-live="polite"></aside>
    </div>
  </section>

  <section aria-labelledby="h-rules">
    <div class="sec-head">
      <div class="eyebrow" id="t-r-eyebrow"></div>
      <h2 id="h-rules"></h2>
      <p class="lede" id="t-r-lede"></p>
    </div>
    <div class="tbl-wrap"><table id="rules"></table></div>
  </section>

  <section class="two">
    <div>
      <div class="sec-head">
        <div class="eyebrow" id="t-ram-eyebrow"></div>
        <h2 id="h-ram"></h2>
      </div>
      <div class="ram-bar" id="ram-bar"></div>
      <div class="ram-scale"><span>0</span><span>8</span><span>16</span><span>24</span><span>32 GB</span></div>
      <div class="ram-legend" id="ram-legend"></div>
      <div class="verdict" id="ram-verdict"></div>
      <ul class="save-list" id="ram-save"></ul>
    </div>
    <div>
      <div class="sec-head">
        <div class="eyebrow" id="t-ip-eyebrow"></div>
        <h2 id="h-ip"></h2>
      </div>
      <div class="tbl-wrap"><table id="addr"></table></div>
    </div>
  </section>

  <section aria-labelledby="h-notes">
    <div class="sec-head">
      <div class="eyebrow" id="t-n-eyebrow"></div>
      <h2 id="h-notes"></h2>
    </div>
    <ol class="notes" id="notes"></ol>
  </section>

  <footer><span id="t-foot-l"></span><span id="t-foot-r"></span></footer>
</div>

    r(X(i),PY,CW,ph,'panel',5);
    o.push(`<rect x="${X(i)}" y="${PY}" width="${CW}" height="5" rx="2" style="fill:${col}"/>`);
    tx(X(i)+12,PY+30,k,'t-disp','start',`font-size="21" style="fill:${col}"`);
    tx(X(i)+CW-12,PY+28,z.ph,'t-mono t-3','end','font-size="10.5"');
    tx(X(i)+12,PY+50,z.net,'t-mono','start','font-size="11.5" font-weight="700"');
    tx(X(i)+12,PY+67,`${z.ls} · gw .1`,'t-mono t-3','start','font-size="10"');
    vms.forEach((v,j) => {
      const y = PY+80+j*88;
      r(X(i)+8,y,CW-16,80,'vmcard',4);
      tx(X(i)+18,y+20,v.n,'t-mono','start','font-size="12.5" font-weight="700"');
      o.push(v.on ? `<circle cx="${X(i)+CW-22}" cy="${y+16}" r="5" style="fill:${col}"/>` : `<circle cx="${X(i)+CW-22}" cy="${y+16}" r="4.5" style="fill:none;stroke:${col};stroke-width:1.8"/>`);
      tx(X(i)+18,y+38,v.ip,'t-mono','start',`font-size="11" style="fill:${col}"`);
      tx(X(i)+18,y+55,L(v.role),'','start','font-size="11.5" class="t-2"');
      tx(X(i)+18,y+71,`${v.cpu} vCPU · ${v.ram} GB · ${v.on ? t.on : t.off}`,'t-mono t-3','start','font-size="9.8"');
    });
    o.push('</g>');
  });
  // admin path overlay
  const mgX = X(0)+CW/2 - 16;
  o.push(`<path class="admin-path" d="M946 108 V142 H1072 V296 H614 V350 M614 350 V414 H${mgX} V${PY+80}"/>`);
  o.push(`<circle cx="946" cy="108" r="4" style="fill:var(--admin)"/><circle cx="${mgX}" cy="${PY+80}" r="4" style="fill:var(--admin)"/>`);
  // bottom row: sandbox, AI, OT, legend
  const BY = 662;
  r(X(0),BY,356,146,'sbx',5);
  tx(X(0)+14,BY+28,t.sbx,'t-disp','start','font-size="20"');
  tx(X(0)+14,BY+47,t.sbxSub,'t-mono t-3','start','font-size="10"');
  const gap = t.sbxGap.split(': ');
  tx(X(0)+200,BY+92,gap[0]+(gap[1]?':':''),'','start','font-size="11.5" class="t-2"');
  if (gap[1]) tx(X(0)+200,BY+109,gap[1],'','start','font-size="11.5" class="t-2"');
  const sv = t.sbxVm; r(X(0)+10,BY+56,172,80,'vmcard',4);
  tx(X(0)+20,BY+76,sv.n,'t-mono','start','font-size="12.5" font-weight="700"');
  o.push(`<circle cx="${X(0)+168}" cy="${BY+72}" r="4.5" style="fill:none;stroke:var(--ink);stroke-width:1.8"/>`);
  tx(X(0)+20,BY+94,sv.ip,'t-mono t-2','start','font-size="11"');
  tx(X(0)+20,BY+111,sv.role,'','start','font-size="11.5" class="t-2"');
  tx(X(0)+20,BY+127,`${sv.cpu} vCPU · ${sv.ram} GB · ${t.off}`,'t-mono t-3','start','font-size="9.8"');
  [['AI','10.20.70.0/24','P5','vmx7','--z-ai',2],['OT','10.20.80.0/24','P6','vmx8','--z-ot',3]].forEach(([n,net,ph,nic,c,i]) => {
    r(X(i),BY,CW,140,'ghost',5);
    tx(X(i)+12,BY+30,n,'t-disp','start',`font-size="21" style="fill:var(${c})" opacity=".75"`);
    tx(X(i)+CW-12,BY+28,ph,'t-mono t-3','end','font-size="10.5"');
    tx(X(i)+12,BY+50,net,'t-mono t-2','start','font-size="11.5"');
    tx(X(i)+12,BY+68,`${nic} · ${t.reserved}`,'t-mono t-3','start','font-size="10"');
  });
  // legend in col 5
  const lx = X(5), ly = BY;
  tx(lx,ly+14,lang==='es'?'LEYENDA':'LEGEND','t-mono t-3','start','font-size="10" letter-spacing="1.5"');
  t.legend.forEach(([k,label],i) => {
    const y = ly+34+i*20;
    if (k==='ink') p(`M${lx} ${y-4} H${lx+26}`,'link-ink');
    if (k==='admin') p(`M${lx} ${y-4} H${lx+26}`,'admin-path');
    if (k==='deny') o.push(`<circle cx="${lx+13}" cy="${y-4}" r="6" class="block-dot"/>`);
    if (k==='ghost') r(lx+3,y-11,20,14,'ghost',2);
    if (k==='on') o.push(`<circle cx="${lx+13}" cy="${y-4}" r="5" style="fill:var(--ink-2)"/>`);
    if (k==='off') o.push(`<circle cx="${lx+13}" cy="${y-4}" r="4.5" style="fill:none;stroke:var(--ink-2);stroke-width:1.8"/>`);
    tx(lx+36,y,label,'','start','font-size="11.5"');
  });
  const svg = $('dg'); svg.innerHTML = o.join('');
  svg.setAttribute('aria-label', t.dLede);
}

/* ---------- matrix ---------- */
function renderMatrix(){
  const t = T[lang]; const o = [];
  o.push(`<div class="corner">${esc(t.corner)}</div>`);
  COLS.forEach(c => o.push(`<div class="h col" style="--c:${zColor(c)}">${esc(zName(c))}</div>`));
  ROWS.forEach(rw => {
    o.push(`<div class="h row" style="--c:${zColor(rw)}">${esc(zName(rw))}</div>`);
    MX[rw].forEach((cell,ci) => {
      const key = `${rw}>${COLS[ci]}`;
      const txt = cell.s==='same' ? '—' : cell.s==='na' ? '·' : cell.s==='deny' ? '' : (CELL_TXT[lang][cell.l] || cell.l);
      const sym = cell.s==='allow' ? '✓' : cell.s==='deny' ? '✕' : cell.s==='cond' ? '◐' : '';
      const inter = cell.s==='same' || cell.s==='na';
      o.push(`<button type="button" class="cell ${cell.s}" data-k="${key}" ${inter?'tabindex="-1" aria-disabled="true"':''} aria-pressed="${key===sel}" aria-label="${esc(zName(rw))} → ${esc(zName(COLS[ci]))}: ${esc(t.stateTxt[cell.s])}"><span>${sym?`<span class="sym">${sym}</span>`:''}${esc(txt)}</span></button>`);
    });
  });
  $('mx').innerHTML = o.join('');
  $('mx-legend').innerHTML = t.mxLegend.map(([k,l]) => `<span><i class="cell ${k}" style="min-height:0;padding:0"></i>${esc(l)}</span>`).join('');
  renderDetail();
}
function renderDetail(){
  const t = T[lang]; const [rw,cl] = sel.split('>');
  const cell = MX[rw][COLS.indexOf(cl)];
  const rules = (cell.r||[]).map(id => RULES.find(r => r.id===id));
  const why = CELL_WHY[lang][sel] || (rules[0] ? L(rules[0].why) : '');
  $('detail').innerHTML = `
    <div class="eyebrow">${esc(lang==='es'?'Flujo seleccionado':'Selected flow')}</div>
    <div class="route"><span style="color:${zColor(rw)}">${esc(zName(rw))}</span> → <span style="color:${zColor(cl)}">${esc(zName(cl))}</span></div>
    <div><span class="act ${cell.s==='same'||cell.s==='na'?'':cell.s}">${esc(t.stateTxt[cell.s])}${cell.l && cell.s!=='deny' ? ' · ' + esc(CELL_TXT[lang][cell.l] || cell.l) : ''}</span></div>
    <p>${esc(why)}</p>
    ${rules.length ? `<div class="eyebrow">${esc(t.detailRules)}</div><ul>${rules.map(r => `<li><span class="rid">${r.id}</span><span>${esc(L(r.ifc))} · ${esc(L(r.src))} → ${esc(L(r.dst))} · <span class="mono">${esc(r.svc)}</span></span></li>`).join('')}</ul>` : ''}`;
  document.querySelectorAll('#rules tr[data-id]').forEach(tr => tr.classList.toggle('is-hl', rules.some(r => r.id===tr.dataset.id)));
  // highlight zones in diagram
  const zs = touched ? [rw, cl].filter(k => Z[k]) : [];
  document.querySelectorAll('#dg .zone').forEach(g => g.classList.toggle('dim', zs.length>0 && !zs.includes(g.dataset.zone)));
}

/* ---------- tables ---------- */
function renderRules(){
  const t = T[lang];
  $('rules').innerHTML = `<thead><tr>${t.rHead.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${RULES.map(r=>`
    <tr data-id="${r.id}"><td class="rid">${r.id}</td><td>${esc(L(r.ifc))}</td><td class="mono">${esc(L(r.src))}</td><td class="mono">${esc(L(r.dst))}</td><td class="mono">${esc(r.svc)}</td><td><span class="act ${r.act}">${ACT[lang][r.act]}</span></td><td class="mono">${r.ph}</td><td>${esc(L(r.why))}</td></tr>`).join('')}</tbody>`;
}
function renderAddr(){
  const t = T[lang];
  const rows = ZORDER.map(k => [k, Z[k].ls, Z[k].net, Z[k].gw, Z[k].nic]);
  const dot = k => Z[k] ? `<span class="zdot" style="background:var(${Z[k].c})"></span>` : k==='AI' ? '<span class="zdot" style="background:var(--z-ai)"></span>' : k==='OT' ? '<span class="zdot" style="background:var(--z-ot)"></span>' : '<span class="zdot" style="background:var(--z-wan)"></span>';
  $('addr').innerHTML = `<thead><tr>${t.ipHead.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.concat(t.ipExtra).map(r=>`<tr><td>${dot(r[0])}<b>${esc(r[0])}</b></td><td class="mono">${esc(r[1])}</td><td class="mono">${esc(r[2])}</td><td class="mono">${esc(r[3])}</td><td class="mono">${esc(r[4])}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="5" style="color:var(--ink-2);font-size:12.5px;border-bottom:none">${esc(t.ipNote)}</td></tr></tfoot>`;
}
function renderRam(){
  const t = T[lang];
  const segs = [{k:'host', label:t.ramLegend.host, gb:7, cls:'host', txt:'6–8'}];
  ZORDER.forEach(k => VMS[k].filter(v=>v.on).forEach(v => segs.push({label:v.n, gb:v.ram, col:`var(${Z[k].c})`, txt:v.ram})));
  segs.splice(1,0,{label:'fw-01', gb:2, col:'var(--ink)', txt:2});
  segs.push({label:t.ramLegend.ondemand, gb:4, cls:'ondemand', txt:4});
  $('ram-bar').innerHTML = segs.map(s => `<div class="ram-seg ${s.cls||''}" style="flex:${s.gb} 0 0; ${s.col?`background:${s.col}`:''}" title="${esc(s.label)} · ${s.txt} GB">${s.gb>=2?esc(s.txt):''}</div>`).join('');
  $('ram-legend').innerHTML = segs.map(s => `<span><i class="sw ram-seg ${s.cls||''}" style="${s.col?`background:${s.col}`:''};padding:0"></i>${esc(s.label)} · <span class="mono">${esc(s.txt)} GB</span></span>`).join('');
  $('ram-verdict').innerHTML = t.ramVerdict;
  $('ram-save').innerHTML = t.ramSave.map(s=>`<li>${esc(s)}</li>`).join('');
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang === 'en' ? 'en-GB' : 'es';
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang===lang)));
  $('t-eyebrow').textContent = t.eyebrow; $('t-title').innerHTML = t.title;
  $('t-block').innerHTML = t.block.map(([k,v]) => `<div><b>${esc(k)}</b>${esc(v)}</div>`).join('');
  const set = (id,v) => { $(id).textContent = v; };
  set('t-d-eyebrow',t.dEyebrow); set('h-diagram',t.dTitle); set('t-d-lede',t.dLede); set('t-d-cap',t.dCap); set('t-d-hint',t.dHint);
  set('t-m-eyebrow',t.mEyebrow); set('h-matrix',t.mTitle); set('t-m-lede',t.mLede);
  set('t-r-eyebrow',t.rEyebrow); set('h-rules',t.rTitle); set('t-r-lede',t.rLede);
  set('t-ram-eyebrow',t.ramEyebrow); set('h-ram',t.ramTitle);
  set('t-ip-eyebrow',t.ipEyebrow); set('h-ip',t.ipTitle);
  set('t-n-eyebrow',t.nEyebrow); set('h-notes',t.nTitle);
  $('notes').innerHTML = t.notes.map(n => `<li><span>${n}</span></li>`).join('');
  set('t-foot-l',t.footL); set('t-foot-r',t.footR);
  svgDiagram(); renderRules(); renderAddr(); renderRam(); renderMatrix();
}

document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; try { localStorage.setItem('plano-lang', lang); } catch(err) {}
  render();
});
$('mx').addEventListener('click', e => {
  const b = e.target.closest('.cell'); if (!b || b.getAttribute('aria-disabled') === 'true') return;
  sel = b.dataset.k; touched = true;
  document.querySelectorAll('#mx .cell').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.k === sel)));
  renderDetail();
});
render();
})();
</script>
</body></html>
